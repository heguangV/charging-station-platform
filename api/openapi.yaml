    ChargerStatusStats:
      type: object
      description: The charger fleet census and its health.
      required: [idleCount, occupiedCount, faultyCount, restartingCount, disabledCount, operationalCount, totalCount, healthPercent]
      properties:
        idleCount: {type: integer, format: int64, minimum: 0}
        occupiedCount: {type: integer, format: int64, minimum: 0}
        faultyCount: {type: integer, format: int64, minimum: 0}
        restartingCount: {type: integer, format: int64, minimum: 0}
        disabledCount: {type: integer, format: int64, minimum: 0}
        operationalCount:
          type: integer
          format: int64
          minimum: 0
          description: Idle plus occupied. A faulty or disabled device cannot
            serve, and a restarting one is not available when it is counted.
        totalCount:
          type: integer
          format: int64
          minimum: 0
          description: Every charger, including a disabled one.
        healthPercent:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: The operational share, to two decimals. Zero for an empty
            fleet.
    StatsOverview:
      type: object
      description: The lifetime operations snapshot. Windowed figures are not
        part of it; they belong to /admin/stats/revenue.
      required: [generatedAt, totalRevenueCent, totalChargeCount, fastChargeCount, slowChargeCount, registeredUserCount, stationCount, activeOrderCount, chargers]
      properties:
        generatedAt:
          type: integer
          format: int64
          description: When the snapshot was computed, UTC Unix seconds.
        totalRevenueCent:
          type: integer
          format: int64
          minimum: 0
          description: Lifetime revenue over every completed order.
        totalChargeCount: {type: integer, format: int64, minimum: 0}
        fastChargeCount:
          type: integer
          format: int64
          minimum: 0
          description: Completed orders on a DC charger.
        slowChargeCount:
          type: integer
          format: int64
          minimum: 0
          description: Completed orders on an AC charger.
        registeredUserCount: {type: integer, format: int64, minimum: 0}
        stationCount: {type: integer, format: int64, minimum: 0}
        activeOrderCount:
          type: integer
          format: int64
          minimum: 0
          description: Orders that have not reached a terminal state.
        chargers: {$ref: '#/components/schemas/ChargerStatusStats'}
    RevenueStatsEnvelope:
      type: object
      required: [success, code, message, data]
      properties:
        success: {type: boolean, enum: [true]}
        code: {type: integer, enum: [0]}
        message: {type: string}
        data: {$ref: '#/components/schemas/RevenueStats'}
    ChargerStatusStatsEnvelope:
      type: object
      required: [success, code, message, data]
      properties:
        success: {type: boolean, enum: [true]}
        code: {type: integer, enum: [0]}
        message: {type: string}
        data: {$ref: '#/components/schemas/ChargerStatusStats'}
    StatsOverviewEnvelope:
      type: object
      required: [success, code, message, data]
      properties:
        success: {type: boolean, enum: [true]}
        code: {type: integer, enum: [0]}
        message: {type: string}
        data: {$ref: '#/components/schemas/StatsOverview'}

    StationProfileUpdate:
      type: object
      description: |-
        The editable profile of a station. The code and the status are absent on
        purpose: this endpoint does not accept them.
      required: [name, address, latitudeE6, longitudeE6]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          minLength: 1
          maxLength: 255
        latitudeE6:
          type: integer
          format: int64
          minimum: -90000000
          maximum: 90000000
        longitudeE6:
          type: integer
          format: int64
          minimum: -180000000
          maximum: 180000000
    StationProfileResponseEnvelope:
      type: object
      required: [success, code, message, data]
      properties:
        success: {type: boolean, enum: [true]}
        code: {type: integer, enum: [0]}
        message: {type: string}
        data: {$ref: '#/components/schemas/StationCreateResponse'}
    GlobalTariff:
      type: object
      description: One tariff configuration and how many chargers share it.
      required: [electricityPriceCentPerKwh, servicePriceCentPerKwh, chargerCount]
      properties:
        electricityPriceCentPerKwh: {type: integer, format: int64, minimum: 0}
        servicePriceCentPerKwh: {type: integer, format: int64, minimum: 0}
        offPeakElectricityPriceCentPerKwh:
          type: integer
          format: int64
          minimum: 0
          description: Present only for a charger with a time-of-use window.
        offPeakStartHour:
          type: integer
          minimum: 0
          maximum: 23
          description: |-
            Wall-clock hour in the deployment's billing timezone
            (NCS_BILLING_TZ, default Asia/Shanghai) - not UTC.
        offPeakEndHour: {type: integer, minimum: 0, maximum: 23}
        chargerCount: {type: integer, format: int64, minimum: 0}
    GlobalTariffView:
      type: object
      required: [chargerCount, configurationCount, minElectricityPriceCentPerKwh, maxElectricityPriceCentPerKwh, minServicePriceCentPerKwh, maxServicePriceCentPerKwh, offPeakChargerCount, flatChargerCount, configurations]
      properties:
        chargerCount:
          type: integer
          format: int64
          minimum: 0
          description: Every charger in the fleet.
        configurationCount: {type: integer, format: int64, minimum: 0}
        minElectricityPriceCentPerKwh: {type: integer, format: int64, minimum: 0}
        maxElectricityPriceCentPerKwh: {type: integer, format: int64, minimum: 0}
        minServicePriceCentPerKwh: {type: integer, format: int64, minimum: 0}
        maxServicePriceCentPerKwh: {type: integer, format: int64, minimum: 0}
        offPeakChargerCount:
          type: integer
          format: int64
          minimum: 0
          description: Chargers with a time-of-use window.
        flatChargerCount:
          type: integer
          format: int64
          minimum: 0
          description: Chargers with a single price.
        configurations:
          type: array
          description: Every distinct configuration, most common first. A list
            even when the fleet is empty.
          items: {$ref: '#/components/schemas/GlobalTariff'}
    GlobalTariffUpdate:
      type: object
      description: |-
        The tariff every charger should hold. The off-peak triple is
        all-or-nothing; absent means the fleet becomes flat.
      required: [electricityPriceCentPerKwh, servicePriceCentPerKwh, reason]
      properties:
        electricityPriceCentPerKwh: {type: integer, format: int64, minimum: 0}
        servicePriceCentPerKwh: {type: integer, format: int64, minimum: 0}
        offPeakElectricityPriceCentPerKwh: {type: integer, format: int64, minimum: 0}
        offPeakStartHour:
          type: integer
          minimum: 0
          maximum: 23
          description: |-
            Wall-clock hour in the deployment's billing timezone
            (NCS_BILLING_TZ, default Asia/Shanghai) - not UTC.
        offPeakEndHour: {type: integer, minimum: 0, maximum: 23}
        reason:
          type: string
          minLength: 2
          maxLength: 200
          description: Why the fleet's price changed. Written to the audit trail.
    GlobalTariffResult:
      type: object
      required: [affectedChargers, previousConfigurations, electricityPriceCentPerKwh, servicePriceCentPerKwh]
      properties:
        affectedChargers:
          type: integer
          format: int64
          minimum: 0
          description: How many devices now carry the new tariff.
        previousConfigurations:
          type: integer
          format: int64
          minimum: 0
          description: How many distinct tariffs the change replaced. One means
            the fleet already agreed.
        electricityPriceCentPerKwh: {type: integer, format: int64, minimum: 0}
        servicePriceCentPerKwh: {type: integer, format: int64, minimum: 0}
        offPeakElectricityPriceCentPerKwh: {type: integer, format: int64, minimum: 0}
        offPeakStartHour:
          type: integer
          minimum: 0
          maximum: 23
          description: |-
            Wall-clock hour in the deployment's billing timezone
            (NCS_BILLING_TZ, default Asia/Shanghai) - not UTC.
        offPeakEndHour: {type: integer, minimum: 0, maximum: 23}
    GlobalTariffViewEnvelope:
      type: object
      required: [success, code, message, data]
      properties:
        success: {type: boolean, enum: [true]}
        code: {type: integer, enum: [0]}
        message: {type: string}
        data: {$ref: '#/components/schemas/GlobalTariffView'}
    GlobalTariffResultEnvelope:
      type: object
      required: [success, code, message, data]
      properties:
        success: {type: boolean, enum: [true]}
        code: {type: integer, enum: [0]}
        message: {type: string}
        data: {$ref: '#/components/schemas/GlobalTariffResult'}

    ChargerBatchItem:
      type: object
      description: One device to create, as an operator types it in.
      required: [code, connectorType, powerWatt]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
          description: The bay's identifier, unique within the station.
        connectorType:
          type: string
          enum: [AC, DC]
          description: The platform's own words, not the console's 0/1 shorthand.
        powerWatt:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000
    ChargerBatchRequest:
      type: object
      required: [stationId, chargers]
      properties:
        stationId:
          type: integer
          format: int64
          minimum: 1
        chargers:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/ChargerBatchItem'}
    ChargerBatchResponse:
      type: object
      description: |-
        The devices the batch created. `chargerCount` equals the length of
        `created` and is stated separately so a client that only needs the count
        does not have to walk the list.
      required: [stationId, chargerCount, created]
      properties:
        stationId: {type: integer, format: int64}
        chargerCount: {type: integer, format: int64, minimum: 0}
        created:
          type: array
          items: {$ref: '#/components/schemas/Charger'}
    ChargerBatchResponseEnvelope:
      type: object
      required: [success, code, message, data]
      properties:
        success: {type: boolean, enum: [true]}
        code: {type: integer, enum: [0]}
        message: {type: string}
        data: {$ref: '#/components/schemas/ChargerBatchResponse'}

    UserArchiveDraft:
      type: object
      description: One account to archive, as an operator types it in.
      required: [phone]
      properties:
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
          description: The phone that will own the account, and the door it
            keeps signing in through.
        displayName:
          type: string
          minLength: 1
          maxLength: 20
          description: Optional. An unnamed draft takes the registration
            default, so an archived account is indistinguishable from a
            self-registered one in every list.
    UserArchiveRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 20
    UserRecord:
      type: object
      description: One archived account. balanceCent is always zero at
        creation; it is stated so the console can render an archived account
        with the same card it uses everywhere else.
      required: [id, phone, displayName, status, balanceCent]
      properties:
        id: {type: integer, format: int64}
        phone: {type: string}
        displayName: {type: string}
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        balanceCent:
          type: integer
          format: int64
          minimum: 0
    UserRecordEnvelope:
      type: object
      required: [success, code, message, data]
      properties:
        success: {type: boolean, enum: [true]}
        code: {type: integer, enum: [0]}
        message: {type: string}
        data: {$ref: '#/components/schemas/UserRecord'}
    UserBatchRequest:
      type: object
      description: One page of a roster. Phones must be unique inside the page
        as well as against the platform.
      required: [users]
      properties:
        users:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: '#/components/schemas/UserArchiveDraft'}
    UserBatchResponse:
      type: object
      description: |-
        The accounts the page created. `userCount` equals the length of
        `created` and is stated separately so a client that only needs the
        count does not have to walk the list.
      required: [userCount, created]
      properties:
        userCount: {type: integer, format: int64, minimum: 0}
        created:
          type: array
          items: {$ref: '#/components/schemas/UserRecord'}
    UserBatchResponseEnvelope:
      type: object
      required: [success, code, message, data]
      properties:
        success: {type: boolean, enum: [true]}
        code: {type: integer, enum: [0]}
        message: {type: string}
        data: {$ref: '#/components/schemas/UserBatchResponse'}

security:
  - bearerAuth: []
