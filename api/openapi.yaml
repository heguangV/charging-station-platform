  /admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            type: integer
            enum: [0, 1]
      responses:
        '200':
          description: User page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      operationId: adminCreateUser
      summary: Archive one account on a user's behalf
      description: |-
        Most accounts arrive by themselves: a phone that signs in with an SMS
        code registers automatically (UC-U-01). This archives the accounts that
        loop cannot produce - a house account, a roster entry, a migrated user.

        The account is born the way a self-registered one is: ACTIVE, with a
        zero-balance wallet and no password. The user keeps signing in through
        SMS, which is why no credential is accepted here - a password an
        operator chose for a user is a credential the user never agreed to
        carry. A phone that is already registered is a 409, not a warning: a
        skipped entry would leave the operator guessing whether the account
        exists.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserArchiveRequest'
      responses:
        '201':
          description: The account was created (or replayed from the idempotency key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRecordEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |-
            The phone is already registered, or the idempotency key was reused
            for a different request. No account was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/users/batch:
    post:
      tags: [admin]
      operationId: adminCreateUsersBatch
      summary: Archive a page of a roster
      description: |-
        A roster is enrolled a page at a time, and the page is all-or-nothing:
        one phone that already exists aborts it and nothing is created - not
        the entries before it, not the entries after it. A phone repeated
        inside one page is refused before the transaction opens, so the answer
        names the phone instead of leaving the caller to compare two rows by
        eye.

        Every account is created the way a self-registered one is: ACTIVE, a
        zero-balance wallet, no password. Beyond a page, bulk loads go through
        the seed tooling, not this endpoint.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBatchRequest'
      responses:
        '201':
          description: Every account in the page was created (or replayed from the idempotency key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBatchResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |-
            A phone in the page is already registered, or the idempotency key
            was reused for a different page. Nothing was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/orders:
    get:
      tags: [admin]
      operationId: adminListOrders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: orderNo
          in: query
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: userId
          in: query
          description: |-
            Only orders belonging to this user. Omit it to list every user's
            orders; the management UI opens a user's detail page and asks for
            that user's orders.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Admin order page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/orders/{orderNo}/refund:
    post:
      tags: [admin]
      operationId: adminRefundOrder
      description: Returns a completed order's settled amount to the user's
        wallet (BR-11 audit inside the transaction). The order business state
        stays COMPLETED; only the payment state reverts.
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 64
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Refund recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/appeals:
    get:
      tags: [admin]
      operationId: adminListAppeals
      description: |-
        The appeal queue (UC-U-09), newest first, optionally filtered by
        status.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
      responses:
        '200':
          description: Appeal page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealPageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/appeals/{appealId}/approve:
    post:
      tags: [admin]
      operationId: adminApproveAppeal
      description: |-
        Approves an appeal (UC-U-09 pt 5, 二次确认): the appeal becomes
        APPROVED, the order is cancelled and the settled amount is refunded
        to the user's wallet (REFUND ledger row), with the operation_logs
        audit trail in the same transaction. A repeated decision is a no-op
        that returns the current result (重复审核不得重复记账).
      parameters:
        - name: appealId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Approval applied, or a repeated decision returning the
            current appeal state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/accounts:
    get:
      tags: [admin]
      operationId: adminListAccounts
      description: Lists administrator accounts. SUPER_ADMIN only.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Administrator account page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountPageEnvelope'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [admin]
      operationId: adminCreateAccount
      description: Creates an active OPERATOR account that must change its initial password. SUPER_ADMIN only.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminAccountRequest'
      responses:
        '201':
          description: Administrator account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountResponseEnvelope'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /admin/accounts/{accountId}/status:
    put:
      tags: [admin]
      operationId: adminSetAccountStatus
      description: |-
        Enables or disables an administrator with optimistic concurrency. SUPER_ADMIN only.
        The caller cannot disable itself or the last active SUPER_ADMIN. A disabled
        administrator's existing session is rejected on its next request.
      parameters:
        - name: accountId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAdminAccountStatusRequest'
      responses:
        '200':
          description: Administrator status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountResponseEnvelope'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /admin/appeals/{appealId}/reject:
    post:
      tags: [admin]
      operationId: adminRejectAppeal
      description: |-
        Dismisses an appeal: it becomes REJECTED with the operator's reason, and the
        order and the wallet stay exactly as they are - rejection refunds nothing and
        cancels nothing, which is what approval is for. A decision is final: a second
        decision on the same appeal is a no-op that returns the current state, so a
        repeated request can never flip an approved, refunded order.
      parameters:
        - name: appealId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Why the appeal is dismissed. Audited and shown to the customer.
      responses:
        '200':
          description: Rejection applied, or a repeated decision returning the current appeal state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /admin/chargers/{chargerId}/restart:
    post:
      tags: [admin]
      operationId: adminRestartCharger
      parameters:
        - name: chargerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
      responses:
        '202':
          description: Device command accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /wallet:
    get:
      tags: [wallet]
      operationId: getWallet
      responses:
        '200':
          description: Current wallet balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /wallet/top-up:
    post:
      tags: [wallet]
      operationId: topUpWallet
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountCent]
              properties:
                amountCent: { type: integer, format: int64, minimum: 1, maximum: 1000000 }
      responses:
        '200':
          description: Wallet credited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /wallet/transactions:
    get:
      tags: [wallet]
      operationId: listWalletTransactions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: type
          in: query
          schema:
            type: string
            enum: [TOP_UP, CHARGE, REFUND, ADJUSTMENT]
      responses:
        '200':
          description: Wallet ledger page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/stats/revenue:
    get:
      tags: [admin]
      operationId: adminRevenueStats
      summary: Revenue and energy per bucket over a time range
      description: |-
        The series behind the console's revenue trend and its daily and hourly
        detail tables. It is a read with an administrator session; an auditor may
        look at the figures, and nothing here changes a row.

        `fromAt` and `toAt` are required UTC Unix seconds and the range is
        half-open. The platform does not default them: it cannot know which
        timezone the caller's "last seven days" is in, and guessing one would
        answer a question nobody asked. The range is capped at 90 days, which is
        the widest window the console offers.

        Revenue is the bill of a COMPLETED order, attributed to the moment the
        charge stopped - the instant the stop receipt froze the amount. A
        cancelled or failed order is not revenue however much it was quoted.

        Buckets are aligned to `fromAt`, not to the epoch, so each bucket is one
        of the caller's own days when the caller asked for its own days. The
        series is dense: a bucket with no orders is present and zero, because a
        chart that skipped a quiet day would draw a trend that never happened.
      parameters:
        - name: fromAt
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0}
          description: Inclusive start, UTC Unix seconds.
        - name: toAt
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 0}
          description: Exclusive end, UTC Unix seconds.
        - name: stationId
          in: query
          required: false
          schema: {type: integer, format: int64, minimum: 1}
          description: Restrict to one station. Absent means every station.
        - name: bucket
          in: query
          required: false
          schema:
            type: string
            enum: [hour, day]
            default: day
      responses:
        '200':
          description: The revenue series and its range totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueStatsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/stats/chargers:
    get:
      tags: [admin]
      operationId: adminChargerStats
      summary: The charger fleet census and its health
      description: |-
        Every charger is counted, including a disabled one: an operator asking
        how many devices exist is not asking how many are usable, and the health
        figure is only meaningful against the whole fleet.

        A charger is operational when it is idle or occupied. A faulty or
        disabled device cannot serve, and a restarting one is not available at
        the moment it is counted. `healthPercent` is the operational share, kept
        to two decimals so losing one device in a large fleet is visible.
      parameters:
        - name: stationId
          in: query
          required: false
          schema: {type: integer, format: int64, minimum: 1}
          description: Restrict to one station. Absent means every station.
      responses:
        '200':
          description: The fleet census
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargerStatusStatsEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/stats/overview:
    get:
      tags: [admin]
      operationId: adminStatsOverview
      summary: The lifetime operations snapshot
      description: |-
        What the platform has, not what happened in a window: lifetime revenue,
        the number of completed charges and their charger mix, the registered
        accounts, the stations, the orders still in flight, and the fleet census.

        The old service precomputed this into a dashboard snapshot and rebuilt it
        on a timer, which made it fast and occasionally hours out of date. It is
        computed on demand here, because PostgreSQL answers the aggregate faster
        than a reader can look away and a figure is never stale.

        Windowed figures are not part of this payload: only the client knows
        which timezone its "today" is in, so those belong to
        /admin/stats/revenue where the caller states the range.
      responses:
        '200':
          description: The operations snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsOverviewEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/stations/{stationId}:
    put:
      tags: [admin]
      operationId: adminUpdateStationProfile
      summary: Edit a station's name, address and coordinates
      description: |-
        The change is written and audited in one transaction, so the recorded
        before-and-after pair is the one this request actually replaced even when
        two administrators edit the same station at once.

        Only four fields are editable: the name, the address and the two
        coordinates. The code is identity - the audit trail and the order
        history reference it - and the status has its own endpoint with its own
        lifecycle rule. A body that carries either of them is not obeyed.

        Coordinates are E6 integers (degrees times one million): the column holds
        degrees and the conversion happens here, so a client never has to guess
        which unit it is reading.
      parameters:
        - name: stationId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StationProfileUpdate'}
      responses:
        '200':
          description: Station profile updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StationProfileResponseEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/tariffs:
    get:
      tags: [admin]
      operationId: adminGlobalTariff
      summary: The tariff every charger currently carries
      description: |-
        Prices live on chargers, not in a tariff table, so this reports the
        fleet's actual state: the distinct configurations and how many chargers
        share each one, with the ranges and the time-of-use split beside them.

        The range is what makes the view worth reading before a change. A fleet
        where every charger already agrees is a no-op; a fleet spread across a
        wide range is a change worth pausing over.

        The old district-scoped price versions are not modelled here. That is a
        pricing-version subsystem - a version table, an effective-time resolver
        and a scheduled rollover - and this is the smaller thing that is usable
        today against the columns the platform already has.
      responses:
        '200':
          description: The fleet tariff picture
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GlobalTariffViewEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    put:
      tags: [admin]
      operationId: adminUpdateGlobalTariff
      summary: Set one tariff on every charger
      description: |-
        The single most consequential write on this boundary: it changes what
        every charge costs. The reason is required and audited for that reason -
        "who set the platform's price to this, and why" has to be answerable
        afterwards.

        The body is the complete tariff, not a patch. Absent off-peak fields mean
        the fleet becomes flat, the same rule the per-charger endpoint follows:
        after the call every charger holds exactly what was sent, and nobody has
        to reason about which devices were touched.

        Every charger is in scope, a disabled one too: a device switched off
        today is switched on again tomorrow, and leaving it on last year's price
        would be discovered by a customer. Running orders are unaffected - the
        order domain snapshots the tariff when charging starts.

        The response reports how many devices now carry the tariff and how many
        distinct tariffs the change replaced.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GlobalTariffUpdate'}
      responses:
        '200':
          description: Fleet tariff applied
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GlobalTariffResultEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /admin/chargers/batch:
    post:
      tags: [admin]
      operationId: adminCreateChargersBatch
      summary: Commission a bank of chargers at one station
      description: |-
        Entering a station's devices one at a time is twenty trips through a form
        for a twenty-bay station. This is the batch, and its whole point is that
        it is all-or-nothing: a batch that half-succeeded would leave an operator
        counting rows to work out which devices exist, and a station whose device
        list disagrees with the physical cabinet is worse than one that was never
        created.

        The batch is one statement inside one transaction. A code that already
        exists at the station aborts it and nothing is created - not the devices
        before it, not the devices after it. A code repeated inside one request is
        refused before the transaction opens, so the answer names the code instead
        of leaving the caller to compare two rows by eye.

        Only what an operator types in travels: the bay's code, its connector type
        and its power. Status, price and version are the platform's to decide. A
        device is created IDLE at the schema's default price and takes its tariff
        from the tariff endpoints - the platform does not guess a price for
        hardware nobody has priced.

        The station must exist. Its status is deliberately not checked: a device
        bank is commissioned before the station opens.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargerBatchRequest'
      responses:
        '201':
          description: Every device in the batch was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargerBatchResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |-
            A code in the batch already exists at the station, or the idempotency
            key was reused for a different batch. Nothing was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
    chargerGatewayBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
      description: Service credential configured by NCS_CHARGER_GATEWAY_TOKEN.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    StationId:
      name: stationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    OrderNo:
      name: orderNo
      in: path
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 64
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or expired session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Insufficient permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: State or optimistic-lock conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Dependency is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    AgentChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 500 }
        location:
          type: object
          required: [latitudeE6, longitudeE6]
          properties:
            latitudeE6: { type: integer, format: int64, minimum: -90000000, maximum: 90000000 }
            longitudeE6: { type: integer, format: int64, minimum: -180000000, maximum: 180000000 }
        coordinateType: { type: string, enum: [gcj02, wgs84], default: gcj02 }
        chargerType: { type: integer, enum: [0, 1] }
    AgentStation:
      type: object
      required: [id, code, name, address, status, latitudeE6, longitudeE6, chargerCount, idleChargerCount, minPriceCentPerKwh]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        address: { type: string }
        status: { type: string, enum: [OPEN, CLOSED, DISABLED] }
        latitudeE6: { type: integer, format: int64 }
        longitudeE6: { type: integer, format: int64 }
        chargerCount: { type: integer, minimum: 0 }
        idleChargerCount: { type: integer, minimum: 0 }
        operationalChargerCount: { type: integer, minimum: 0 }
        minPriceCentPerKwh: { type: integer, minimum: 0 }
        electricityPriceCentPerKwh: { type: integer, minimum: 0 }
        servicePriceCentPerKwh: { type: integer, minimum: 0 }
        fastChargerCount: { type: integer, minimum: 0 }
        slowChargerCount: { type: integer, minimum: 0 }
        chargerTypes:
          type: array
          items: { type: string, enum: [AC, DC] }
        distanceMeter: { type: integer, format: int64, minimum: 0 }
    AgentPoi:
      type: object
      required: [id, name, category, address, latitudeE6, longitudeE6, distanceMeter]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        address: { type: string }
        latitudeE6: { type: integer, format: int64 }
        longitudeE6: { type: integer, format: int64 }
        distanceMeter: { type: integer, format: int64, minimum: 0 }
        tel: { type: string }
    AgentRouteStep:
      type: object
      required: [instruction, distanceMeter, durationSecond]
      properties:
        instruction: { type: string }
        distanceMeter: { type: integer, format: int64, minimum: 0 }
        durationSecond: { type: integer, format: int64, minimum: 0 }
    AgentPolylinePoint:
      type: object
      required: [latitudeE6, longitudeE6]
      properties:
        latitudeE6: { type: integer, format: int64 }
        longitudeE6: { type: integer, format: int64 }
    AgentRoute:
      type: object
      required: [destinationName, originLatitudeE6, originLongitudeE6, destinationLatitudeE6, destinationLongitudeE6, distanceMeter, durationSecond, provider, fallback, steps, polyline, browserUrl]
      properties:
        destinationName: { type: string }
        originLatitudeE6: { type: integer, format: int64 }
        originLongitudeE6: { type: integer, format: int64 }
        destinationLatitudeE6: { type: integer, format: int64 }
        destinationLongitudeE6: { type: integer, format: int64 }
        distanceMeter: { type: integer, format: int64, minimum: 0 }
        durationSecond: { type: integer, format: int64, minimum: 0 }
        provider: { type: string, enum: [TENCENT_MAP, LOCAL_FALLBACK] }
        fallback: { type: boolean }
        steps: { type: array, items: { $ref: '#/components/schemas/AgentRouteStep' } }
        polyline: { type: array, items: { $ref: '#/components/schemas/AgentPolylinePoint' } }
        browserUrl: { type: string }
    AgentAction:
      type: object
      required: [type, label]
      properties:
        type: { type: string, enum: [open_station, navigate] }
        label: { type: string }
        targetId: { type: string }
        url: { type: string }
    AgentChatResponse:
      type: object
      required: [reply, stations, pois, route, actions, tools, llmUsed, degraded]
      properties:
        reply: { type: string }
        stations: { type: array, items: { $ref: '#/components/schemas/AgentStation' } }
        pois: { type: array, items: { $ref: '#/components/schemas/AgentPoi' } }
        route:
          allOf: [{ $ref: '#/components/schemas/AgentRoute' }]
          nullable: true
        actions: { type: array, items: { $ref: '#/components/schemas/AgentAction' } }
        tools:
          type: array
          items: { type: string, enum: [station_search, station_detail, poi_search, route] }
        llmUsed: { type: boolean }
        degraded: { type: boolean }
    AgentChatResponseEnvelope:
      type: object
      required: [success, code, message, data]
      properties:
        success: { type: boolean, enum: [true] }
        code: { type: integer, enum: [0] }
        message: { type: string }
        data: { $ref: '#/components/schemas/AgentChatResponse' }
    SuccessEnvelope:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        code:
          type: integer
          enum: [0]
        message:
          type: string
          example: ok
        data:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required: [success, code, message]
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          type: integer
          minimum: 1
        message:
          type: string
        traceId:
          type: string
    LoginRequest:
      type: object
      required: [account, password]
      properties:
        account:
          type: string
          minLength: 3
          maxLength: 128
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    RegisterRequest:
      type: object
      required: [phone, password, smsCode]
      properties:
        username:
          type: string
          maxLength: 64
          description: |-
            Optional display name. When it is absent the account is named from
            its phone, the same way the SMS login path names a new account.
        phone:
          type: string
          pattern: '^1[0-9]{10}$'
        password:
          type: string
          minLength: 8
          maxLength: 128
        smsCode:
          type: string
          description: |-
            The code issued for this phone. It is single use: registering
            consumes it, and a second registration needs a fresh code.
        deviceId:
          type: string

    LoginResponseEnvelope:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        code:
          type: integer
          enum: [0]
        message:
          type: string
        data:
          $ref: '#/components/schemas/LoginResponse'
    LoginResponse:
      type: object
      required: [accessToken, expiresAt, identity]
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        identity:
          $ref: '#/components/schemas/Identity'
    IdentityResponseEnvelope:
      type: object
      required: [success, code, message, data]
      properties:
        success:
          type: boolean
          enum: [true]
        code:
          type: integer
          enum: [0]
        message:
          type: string
        data:
          $ref: '#/components/schemas/Identity'
    Identity:
      type: object
      required: [id, role, displayName, status]
      properties:
        id:
          type: integer
          format: int64
        role:
          type: string
          enum: [USER, ADMIN]
        adminRole:
          type: string
          enum: [SUPER_ADMIN, OPERATOR, AUDITOR]
          description: Present only for administrators. AUDITOR is read-only.
        displayName:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    Station:
      type: object
      required: [id, code, name, address, status, latitudeE6, longitudeE6, chargerCount, idleChargerCount, minPriceCentPerKwh]
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        address:
          type: string
        status:
          type: string
          enum: [OPEN, CLOSED, DISABLED]
        latitudeE6:
          type: integer
          format: int64
        longitudeE6:
          type: integer
          format: int64
        chargerCount:
          type: integer
          minimum: 0
        idleChargerCount:
          type: integer
          description: Chargers currently in IDLE state.
          minimum: 0
        minPriceCentPerKwh:
          type: integer
          description: Cheapest charger price at the station, in cents per kWh.
          minimum: 0
        distanceMeter:
          type: integer
          format: int64
          description: Haversine distance to the query coordinates. Present
            only when the query carried coordinates.
          minimum: 0
    Charger:
      type: object
      required: [id, stationId, code, type, powerWatt, status]
      properties:
        id:
          type: integer
          format: int64
        stationId:
          type: integer
          format: int64
        code:
          type: string
        type:
          type: string
          enum: [AC, DC]
        powerWatt:
          type: integer
          format: int64
          minimum: 0
        status:
          $ref: '#/components/schemas/ChargerStatus'
    ChargerStatus:
      type: string
      enum: [IDLE, OCCUPIED, FAULT, RESTARTING, DISABLED]
    OrderStatus:
      type: string
      enum: [CREATED, STARTING, CHARGING, STOPPING, COMPLETED, CANCELLED, FAILED, EXPIRED]
      description: CREATED is a charger reservation awaiting explicit start.
    Order:
      type: object
      required: [orderNo, userId, stationId, chargerId, status, amountCent, createdAt]
      properties:
        orderNo:
          type: string
        userId:
          type: integer
          format: int64
        stationId:
          type: integer
          format: int64
        chargerId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/OrderStatus'
        amountCent:
          type: integer
          format: int64
          minimum: 0
        paidCent:
          type: integer
          format: int64
          minimum: 0
          description: Amount actually settled so far (UC-U-09 pending payment).
        paymentStatus:
          type: string
          enum: [PENDING, PAID, PARTIAL_PAID]
          description: Pending-payment state of a completed order.
        energyWh:
          type: integer
          format: int64
          minimum: 0
        reservedUntil:
          type: string
          format: date-time
          description: |-
            Reservation deadline. Present while status is CREATED; starting
            after this instant expires the order and releases the charger.
        startedAt:
          type: string
          format: date-time
          description: |-
            Device fact time the charge actually started (the CHARGE_STARTED
            receipt). Absent until the device confirms the start.
        chargerPowerWatt:
          type: integer
          format: int64
          minimum: 0
          description: Rated power of the charger this order is bound to, in watts.
        meteredEnergyWh:
          type: integer
          format: int64
          minimum: 0
          description: |-
            Energy the charger has metered so far, from the latest
            CHARGE_PROGRESS receipt. Present while the order is charging once a
            reading has arrived; after the stop the settled figure is `energyWh`.
        meteredAmountCent:
          type: integer
          format: int64
          minimum: 0
          description: |-
            What the metered energy costs at the order's frozen snapshot, priced
            with the same time-of-use engine as the final bill. Present together
            with `meteredEnergyWh`. It is not a settled charge: settlement still
            happens on the stop receipt.
        meteredAt:
          type: string
          format: date-time
          description: Device fact time of the latest meter reading.
        unitPriceCentPerKwh:
          type: integer
          format: int64
          minimum: 0
          description: |-
            Electricity plus service price per kWh that applies to this order
            at the moment of the request, in cents: the frozen snapshot
            resolved against the off-peak window in the deployment's billing
            timezone. Present while the order is active. It exists so a client
            can show an estimate during a charge; the bill is settled from the
            meter reading in the stop receipt.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Profile:
      type: object
      required: [id, phoneMasked, displayName, status, registeredAt]
      properties:
        id:
          type: integer
          format: int64
        phoneMasked:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        registeredAt:
          type: string
          format: date-time
    ProfileUpdateRequest:
      type: object
