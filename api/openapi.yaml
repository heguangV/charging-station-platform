        What the platform recorded for one device command: the outcome the
        charger gateway reported and whether it has been applied to the order.
      required: [commandId, chargerId, action, result, applied, recordedAt]
      properties:
        commandId:
          type: string
        chargerId:
          type: integer
          format: int64
        orderNo:
          type: string
          description: Present for charge commands that belong to an order.
        action:
          type: string
          enum: [START, STOP, RESTART]
        result:
          type: string
          enum: [COMPLETED, FAILED]
        applied:
          type: boolean
          description: |-
            Whether the stored outcome has already been applied to the order.
        recordedAt:
          type: string
          format: date-time
