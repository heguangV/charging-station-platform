    CreateOrderRequest:
      type: object
      required: [chargerId]
      properties:
        chargerId:
          type: integer
          format: int64
          minimum: 1
    ChargerEventRequest:
      type: object
      required: [eventId, eventType, orderNo, chargerId, occurredAt]
      properties:
        eventId:
          type: string
          minLength: 8
          maxLength: 128
          description: Unique receipt identifier and idempotency key.
        eventType:
          type: string
          enum: [CHARGE_STARTED, CHARGE_STOPPED, CHARGE_PROGRESS]
        orderNo:
          type: string
          minLength: 8
          maxLength: 64
        chargerId:
          description: Numeric charger identifier; a decimal string is also accepted for gateway compatibility.
          oneOf:
            - type: integer
              format: int64
              minimum: 1
            - type: string
              pattern: '^[1-9]\d*$'
        occurredAt:
          type: string
          format: date-time
          description: UTC device fact time. Values beyond the configured future-skew limit are rejected.
          example: '2026-09-15T01:10:00Z'
        energyWh:
          type: integer
          format: int64
          minimum: 0
          description: Required when eventType is CHARGE_STOPPED.
        meterStartWh:
          type: integer
          format: int64
          minimum: 0
        meterEndWh:
          type: integer
          format: int64
          minimum: 0
        traceId:
          type: string
          description: Optional gateway trace identifier.
      description: |-
        For CHARGE_STOPPED, `energyWh` is required. If both meter readings are
        present, meterEndWh must be at least meterStartWh and their difference
        must equal energyWh.
    ChargerEventResponseEnvelope:
      type: object
      required: [success, code, message, data]
      properties:
        success: {type: boolean, enum: [true]}
        code: {type: integer, enum: [0]}
        message: {type: string}
        data:
          type: object
          required: [eventId, eventType, orderNo, status, occurredAt, order]
          properties:
            eventId: {type: string}
            eventType:
              type: string
              enum: [CHARGE_STARTED, CHARGE_STOPPED, CHARGE_PROGRESS]
            orderNo: {type: string}
            status: {$ref: '#/components/schemas/OrderStatus'}
            occurredAt:
              type: string
              format: date-time
            order: {$ref: '#/components/schemas/Order'}
    CreateStationRequest:
      type: object
      required: [code, name, address, latitudeE6, longitudeE6]
      properties:
        code:
          type: string
          pattern: '^[A-Za-z0-9_-]{2,32}$'
        name:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          minLength: 1
          maxLength: 255
