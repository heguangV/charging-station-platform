    StationStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [OPEN, CLOSED, DISABLED]
          description: |-
            Target status. Only these transitions are accepted: OPEN<->CLOSED,
            OPEN->DISABLED, CLOSED->DISABLED, DISABLED->OPEN. A change to the
            status the station already has, and DISABLED->CLOSED, are refused
            with 409.
    ChargerStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [IDLE, DISABLED]
          description: |-
            Target status an administrator may set. IDLE<->DISABLED and
            FAULT->IDLE/DISABLED are accepted; OCCUPIED and RESTARTING are
            refused with 409 because a charger in use must be force-released
            first and a restart in flight is decided by its receipt.
    ChargerStatusRecord:
      type: object
      required: [chargerId, chargerCode, status]
      properties:
        chargerId: {type: integer, format: int64}
        chargerCode: {type: string}
        status:
          type: string
          enum: [IDLE, OCCUPIED, FAULT, RESTARTING, DISABLED]
