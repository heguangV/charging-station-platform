name: CI

on:
  pull_request:
    branches: [main, develop, codex/tencent-navigation-integration]
  push:
    branches: [main, develop, codex/tencent-navigation-integration]

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format ninja-build qt6-base-dev libgl1-mesa-dev
          python3 -m pip install --disable-pip-version-check cmake==3.31.6

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev --parallel 2

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset dev

      - name: Repository checks
        env:
          NCS_CHECK_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/check.sh

  windows-source-build:
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt 6.2
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.2.4"
          arch: win64_msvc2019_64
          cache: true

      - name: Install SQLite3
        run: vcpkg install sqlite3:x64-windows

      - name: Configure
        run: >-
          cmake -S . -B build/windows
          -G "Visual Studio 17 2022" -A x64
          "-DCMAKE_TOOLCHAIN_FILE=${env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake"
          -DBUILD_TESTING=ON
          -DNCS_ENABLE_STRICT_WARNINGS=ON

      - name: Build
        run: cmake --build build/windows --config Debug --parallel 2

      - name: Test
        run: ctest --test-dir build/windows -C Debug --output-on-failure

  dashboard:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/dashboard/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: cmake -S . -B ../../build/dashboard-tests
      - run: ctest --test-dir ../../build/dashboard-tests --output-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dashboard-test-results
          path: apps/dashboard/test-results/
